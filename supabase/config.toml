# A string used to distinguish different Supabase projects on the same host. Defaults to the working
# directory name when running `supabase init`.
[project]
id = "smxpskjulpgllkfnlepd"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54321
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.register]
verify_jwt = false

[functions.api-restaurants]
verify_jwt = false

[functions.api-restaurant]
verify_jwt = false

[functions.api-restaurant-menus]
verify_jwt = false

[functions.api-menu]
verify_jwt = false

[functions.api-orders]
verify_jwt = false

[functions.api-subscriptions]
verify_jwt = false

[functions.webhook-stripe]
verify_jwt = false

[functions.webhook-mercadopago]
verify_jwt = false

[functions.mp-oauth-callback]
verify_jwt = false

[functions.payment-onboarding]
verify_jwt = false

[functions.stripe-account-session]
verify_jwt = false

[analytics]
enabled = false
